interface:
  display_name: "Codex Cost"
  short_description: "Fresh-context parallel tasks with one final review"
  default_prompt: "Use $codex-cost as the top-level non-Luna orchestrator. Keep trivial work local; for substantial delegated work, honor configured models and reasoning settings, default non-visual work to Luna, and never assign visuals, layout, or styling to Luna. Treat Luna's call cost as negligible. Split work into small verifiable assignments with explicit dependencies, exclusive write sets, stable inputs, and reserved or isolated shared resources. Use a fresh context for every assignment; run independent ready tasks in parallel within runtime capacity, serializing only conflicting work. Keep shared ledger updates with the parent and evidence in task-specific artifacts. Receive compact status and handle blockers without routine per-assignment review. Require worker self-checks and integration evidence against the stable assembled state, then perform one consolidated parent review. Use fresh workers for review repairs. Report model or clean-context limitations instead of silently substituting."

interface:
  display_name: "Codex Cost"
  short_description: "Fresh-context serial tasks with one final review"
  default_prompt: "Use $codex-cost as the top-level non-Luna orchestrator. Keep trivial work local; for substantial delegated work, honor configured models and reasoning settings, default non-visual work to Luna, and never assign visuals, layout, or styling to Luna. Split work into small verifiable assignments, persist the task ledger, and execute serially with one fresh worker context per assignment, closing each worker before starting the next. Treat Luna's call cost as negligible. Receive compact status and handle blockers without routine per-assignment review. Require worker self-checks and final integration evidence, then perform one consolidated parent review after the task set is ready. Use fresh workers for review repairs. Report model or clean-context limitations instead of silently substituting."

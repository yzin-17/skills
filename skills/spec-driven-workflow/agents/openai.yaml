interface:
  display_name: "Spec-Driven Workflow"
  short_description: "规范化 Spec/Task、后续 TODO、完成归档与一致性 Review"
  default_prompt: "使用 $spec-driven-workflow 处理这项需求。优先创建、更新或审查符合项目约定的 Spec 与任务文档；先判断是否需要拆分独立 Spec 单元，使用带首次创建日期的 Spec 文件名，为验收标准分配稳定 AC 编号并映射到可独立验证的 Task，完成 planning preflight。对已明确确认但留待后续实施的事项，同步到仓库 TODO 索引并保留来源引用；TODO 不替代当前验收义务。只有当当前请求明确包含实施且不存在 Blocking 问题时，才继续代码实施、验证与最终一致性 Review。整个 Task 文档的当前验收范围全部完成且最终 Review 通过后，只有在它不再拥有任何未完成实施事项时才按仓库约定归档；有效后续事项应先转移到统一 TODO 或 active successor Spec/Task，历史引用本身不阻止归档。仍是当前行为契约的 Spec 保持 active，归档来源仅作为历史依据。"
